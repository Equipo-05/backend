name: Integration tests with Newman

on:
  pull_request:
    branches:
      - main

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Build Docker Image
        run: docker build -t sas-app-api .

      - name: Start Containers
        run: docker compose up -d

      # SUSTITUIMOS EL SLEEP POR UNA ESPERA ACTIVA
      - name: Wait for API to be ready
        run: |
          echo "Esperando a que la API responda en el puerto 8086..."
          timeout 90s sh -c 'until curl -s http://localhost:8086/api/auth/login; do echo "Esperando..."; sleep 5; done'
          echo "¡API detectada y funcionando!"

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Tests
        run: newman run social.postman_collection.json -e practicas.postman_environment.json

      # PASO EXTRA: Si falla, muéstrame los logs para saber por qué
      - name: Show Docker Logs on Failure
        if: failure()
        run: |
          docker ps -a
          docker logs sas-app-api
          docker logs sasApp-db